<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBSテロップ</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:sans-serif}
#bar{
  display:flex;align-items:center;gap:14px;width:100%;
  white-space:nowrap;overflow:hidden;padding:10px 14px;
  background-color:#ffd9ec;
  background-image:
    linear-gradient(45deg,#ffffff99 25%,transparent 25%,transparent 75%,#ffffff99 75%),
    linear-gradient(45deg,#ffffff99 25%,transparent 25%,transparent 75%,#ffffff99 75%);
  background-size:24px 24px;background-position:0 0,12px 12px;
}
#label{flex:none;background:#e85a9d;color:white;border-radius:8px;padding:5px 10px;font-weight:bold}
#message{flex:none;font-weight:bold;animation:scroll 12s linear infinite}
@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="bar">
  <span id="label"></span>
  <span id="message"></span>
</div>
<script>
const p=new URLSearchParams(location.search);
const text=p.get("text")||"コメントありがとう♡ チャンネル登録よろしくね！";
const label=p.get("label")||"お知らせ♡";
const size=p.get("size")||"28";
const color=p.get("color")||"pink";
const speed=p.get("speed")||"12";

document.getElementById("message").textContent=text;
document.getElementById("message").style.fontSize=size+"px";
document.getElementById("message").style.animationDuration=speed+"s";
document.getElementById("label").textContent=label;

const colors={
  pink:["#ffd9ec","#ffffff","#e85a9d"],
  purple:["#e5d7ff","#ffffff","#8b5bd6"],
  blue:["#d7f2ff","#ffffff","#339ed0"],
  black:["#333333","#777777","#111111"]
};
const c=colors[color]||colors.pink;
const bar=document.getElementById("bar");
bar.style.backgroundColor=c[0];
bar.style.backgroundImage=
  `linear-gradient(45deg,${c[1]}99 25%,transparent 25%,transparent 75%,${c[1]}99 75%),linear-gradient(45deg,${c[1]}99 25%,transparent 25%,transparent 75%,${c[1]}99 75%)`;
bar.style.backgroundSize="24px 24px";
bar.style.backgroundPosition="0 0,12px 12px";
document.getElementById("label").style.background=c[2];
</script>
</body>
</html>
